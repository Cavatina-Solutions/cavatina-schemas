nodeLinker: node-modules

# The @cavatina-solutions scope lives in the org's GitHub Packages registry, not on
# npmjs.com. It is not called GITHUB_TOKEN because the gh CLI refuses to switch
# accounts while that name is set; CI passes its own issued token in under this one.
# Locally it is a PAT with read:packages, or write:packages to publish by hand.
# Left empty, packages already cached still install — only registry traffic fails.
npmScopes:
  cavatina-solutions:
    npmRegistryServer: 'https://npm.pkg.github.com'
    npmAlwaysAuth: true
    npmAuthToken: '${NPM_GITHUB_TOKEN:-}'
    # Yarn quarantines versions younger than npmMinimalAgeGate (24h by default) so
    # a hijacked public package cannot be pulled before anyone notices. These are
    # our own releases from our own registry, so the gate only blocks us from
    # consuming a release the day we cut it. Off here; still 24h for npmjs.com.
    npmMinimalAgeGate: 0
