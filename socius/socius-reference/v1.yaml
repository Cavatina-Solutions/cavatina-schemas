$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.cavatinasolutions.com/socius/socius-reference/v1.yaml
$comment: '1.0'
title: Socius Reference
description: Reusable factual information about a subject, organized into named reference items.
allOf:
  - $ref: https://schemas.cavatinasolutions.com/socius/socius-scoped-artifact/v1.yaml
type: object
required:
  - category
  - items
properties:
  schema:
    const: socius-reference/v1
  category:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
    description: Taxonomy labels used to find references about this subject; not applicability scope.
  items:
    type: array
    minItems: 1
    description: Named pieces of factual reference information about the subject.
    items:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          minLength: 1
          description: Human-readable name for the reference item.
        description:
          type: string
          minLength: 1
          description: Factual information about this item, including relevant context or qualifications.
      additionalProperties: false
  related_artifacts:
    type: array
    description: General associations to other Socius artifacts, with no implied authority, inheritance, or other domain-specific relationship.
    items:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
          minLength: 1
          description: Socius artifact type being referenced, without a version (for example, socius-standard).
        id:
          type: string
          minLength: 1
          description: Stable ID of the associated artifact.
      additionalProperties: false
unevaluatedProperties: false
