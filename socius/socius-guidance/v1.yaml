$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.cavatinasolutions.com/socius/socius-guidance/v1.yaml
$comment: "1.0"
title: Socius Guidance
allOf:
- $ref: https://schemas.cavatinasolutions.com/socius/socius-artifact/v1.yaml
type: object
required:
- supports_standard
- guidance
properties:
  schema:
    const: socius-guidance/v1
  supports_standard:
    type: string
    description: ID of the Engineering Standard Record this guidance supports (must exist).
  guidance:
    type: string
    description: General guidance notes on the standard and its usage.
  standard_rationale:
    type: string
    description: Engineering reasoning that explains why the associated standard exists.
  implementation:
    type: string
    description: Additional implementation guidance for correctly applying the standard.
  examples:
    type: array
    items:
      type: string
    description: References to example code or implementation patterns that demonstrate correct application.
  pitfalls:
    type: array
    items:
      type: string
    description: Common mistakes or misunderstandings when applying the standard.
  common_mistakes:
    type: array
    items:
      type: string
    description: Common mistakes or misconceptions that contributors should avoid when interpreting or applying the guidance.
  related_guidance:
    type: array
    items:
      type: string
    description: IDs of related Engineering Standards or Guidance documents (must exist).
unevaluatedProperties: false
