$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.cavatinasolutions.com/socius/socius-guide/v1.yaml
$comment: '1.0'
title: Socius Guide
description: Instructions for accomplishing an activity, in a required sequence or as independently usable instructional elements.
allOf:
  - $ref: https://schemas.cavatinasolutions.com/socius/socius-scoped-artifact/v1.yaml
type: object
required:
  - objective
  - instructions
properties:
  schema:
    const: socius-guide/v1
  objective:
    type: string
    minLength: 1
    description: What following this Guide is intended to accomplish.
  apply_when:
    type: array
    minItems: 1
    items:
      type: string
    description: Optional natural-language circumstances in which the Guide applies.
  is_ordered:
    type: boolean
    default: true
    description: Whether the instructions must be followed in sequence, by their order values; defaults to true when omitted.
  instructions:
    type: array
    minItems: 1
    description: Identified instructional elements; follow in sequence when is_ordered is true. Universal inheritance adds new IDs and recursively merges matching identified instructions by property.
    items:
      type: object
      required:
        - id
        - name
        - instructions
      properties:
        id:
          type: string
          minLength: 1
          description: Stable identifier for selective replacement under universal inheritance.
        order:
          type: integer
          description: Sequence position, required on every instruction of an ordered Guide. Values must be distinct within the resolved Guide. May be inherited or changed by an identified child instruction.
        name:
          type: string
          minLength: 1
          description: Human-readable label for referencing this instructional element.
        instructions:
          type: string
          minLength: 1
          description: What to do, including any necessary conditional detail expressed as prose.
      additionalProperties: false
  attachments:
    type: array
    items:
      type: string
    description: References to supporting templates, diagrams, checklists, or other instructional resources.
if:
  properties:
    is_ordered:
      const: false
  required:
    - is_ordered
else:
  properties:
    instructions:
      type: array
      items:
        type: object
        properties:
          order: true
        required:
          - order
unevaluatedProperties: false
