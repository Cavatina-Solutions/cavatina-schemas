$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.cavatinasolutions.com/socius/socius-standard/v1.yaml
$comment: '1.0'
title: Socius Standard
description: Authoritative expectations governing one cohesive subject within the organization's practices.
allOf:
  - $ref: https://schemas.cavatinasolutions.com/socius/socius-scoped-artifact/v1.yaml
type: object
required:
  - category
  - expectations
properties:
  schema:
    const: socius-standard/v1
  category:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
    description: Taxonomy labels for finding standards about this subject; not applicability scope.
  apply_when:
    type: array
    minItems: 1
    items:
      type: string
    description: Optional natural-language circumstances that further constrain when this Standard applies; interpreted by the contributor or agent.
  expectations:
    type: array
    minItems: 1
    description: Related authoritative expectations about one cohesive subject. IDs must be unique within this Standard; consumers check this and resolve inherited IDs.
    items:
      type: object
      required:
        - id
        - statement
      properties:
        id:
          type: string
          minLength: 1
          description: Stable expectation identifier used to add or fully replace the same expectation in an ancestor Standard.
        statement:
          type: string
          minLength: 1
          description: Substantive expectation, including relevant qualifications where needed.
      additionalProperties: false
  extends_standard:
    type: string
    description: ID of one broader Standard whose expectations are inherited; matching expectation IDs replace inherited definitions entirely.
  related_standards:
    type: array
    items:
      type: string
    description: IDs of related Standards; these links do not imply inheritance or precedence.
  notes:
    type: array
    items:
      type: string
    description: Concise supplementary notes about this Standard.
unevaluatedProperties: false
