$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.cavatinasolutions.com/socius/socius-principle-core/v1.yaml
$comment: "1.0"
title: Socius Principle Core
allOf:
- $ref: https://schemas.cavatinasolutions.com/socius/socius-artifact/v1.yaml
type: object
required:
- statement
properties:
  schema:
    const: socius-principle-core/v1
  statement:
    type: string
    description: The enduring engineering principle.
  rationale:
    type: string
    description: Engineering reasoning that explains why this principle exists.
  internal_expression:
    type: string
    description: How the principle is expressed within the company and among team members.
  external_expression:
    type: string
    description: How the principle is expressed in interactions with customers, clients, partners, or other external stakeholders.
  implications:
    type: array
    items:
      type: string
    description: Important implications that naturally follow from this principle.
  derived_principles:
    type: array
    items:
      type: string
    description: IDs of Derived Principles that build upon this Core Principle.
unevaluatedProperties: false
