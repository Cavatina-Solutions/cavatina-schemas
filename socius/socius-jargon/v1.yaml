$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.cavatinasolutions.com/socius/socius-jargon/v1.yaml
$comment: "1.0"
title: Socius Jargon
allOf:
- $ref: https://schemas.cavatinasolutions.com/socius/socius-artifact/v1.yaml
type: object
required:
- term
- definition
properties:
  schema:
    const: socius-jargon/v1
  term:
    type: string
    description: Canonical term, acronym, abbreviation, or phrase being defined.
  definition:
    type: string
    description: Meaning of the term within its applicable organizational or project context.
  aliases:
    type: array
    items:
      type: string
    description: Alternative names, abbreviations, spellings, or forms that refer to the same term.
unevaluatedProperties: false
